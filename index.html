<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Klangfeld</title>
  <meta name="description" content="Spielbarer Sound-Generator mit visueller Oberfläche fürs Handy.">
  <meta name="theme-color" content="#04060c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="stage" aria-label="Spielfläche: links nach rechts Tonhöhe, unten nach oben Klangfarbe"></canvas>

  <header id="bar">
    <nav id="presets" aria-label="Klangfarbe"></nav>
    <div id="row2">
      <span id="hint" aria-live="polite"></span>
      <button id="beat" aria-pressed="false" hidden>Beat ▶</button>
      <button id="tempo" title="Tempo wechseln" hidden>116 BPM</button>
      <button id="mode" aria-pressed="true" title="Frei gleitend oder auf Tonleiter einrasten">Tonleiter</button>
    </div>
  </header>

  <button id="start">
    <span class="logo">Klangfeld</span>
    <p>Tippen zum Starten</p>
    <small>Mit mehreren Fingern spielen.<br>Links/rechts: Tonhöhe · unten/oben: Klangfarbe</small>
    <small id="ios" hidden>iPhone: Kein Ton? Stummschalter an der Seite ausschalten und Lautstärke prüfen.</small>
  </button>

  <script type="module" src="js/app.js"></script>
</body>
</html>
